name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # flexvm's own toolchain. Firecracker builds with the one its rust-toolchain.toml pins.
  RUST_TOOLCHAIN: "1.88.0"
  # No FC_VERSION / CI_VERSION / KERNEL overrides are set here. fetch.sh --urls resolves
  # them, and the cache keys below are built from its output, so setting one changes the keys.

jobs:
  check:
    name: fmt, clippy, unit tests, release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        # The tree predates rustfmt; enforce once it has been formatted in one go.
        continue-on-error: true
        run: |
          if ! cargo fmt --all --check > fmt.diff; then
            echo "::warning title=cargo fmt::$(grep -c '^Diff in' fmt.diff) hunks differ from rustfmt (not enforced yet)"
            exit 1
          fi
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace

  e2e:
    name: end-to-end (KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -m1 -o -E 'vmx|svm' /proc/cpuinfo
          # KVM_GET_API_VERSION must answer 12, and KVM_CREATE_VM must work.
          python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); v = fcntl.ioctl(fd, 0xAE00); vm = fcntl.ioctl(fd, 0xAE01, 0); print("KVM API", v, "vm fd", vm); assert v == 12'
          nproc; free -m; uname -r

      - name: Host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools libseccomp-dev squashfs-tools e2fsprogs

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
          cache-on-failure: true

      # Cache keys: the build inputs in the repo, what fetch.sh resolves (versions and
      # URLs, plus the ETags of the unversioned S3 objects), and the build environment
      # (runner image; flexvm's toolchain for the rootfs; Firecracker's toolchain is
      # pinned by its tag, which the URL list carries).
      - name: Cache keys
        id: keys
        run: |
          ./scripts/fetch.sh --urls > urls.txt
          for f in vmlinux base.squashfs; do
            url=$(awk -v f="$f" '$1 == f {print $2}' urls.txt)
            etag=$(curl -sfI "$url" | tr -d '\r' | awk 'tolower($1) == "etag:" {print $2}')
            test -n "$etag"
            echo "$f-etag $etag" >> urls.txt
          done
          cat urls.txt
          echo "env=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "fc=$(grep '^firecracker ' urls.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "downloads=$(sha256sum urls.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
          rm urls.txt

      # Patched Firecracker: rebuilt only when its inputs change. Each artifact is saved
      # right after it is built, so a failing test run still fills the cache.
      - name: Restore Firecracker
        id: fc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/firecracker
          key: firecracker-${{ steps.keys.outputs.env }}-${{ steps.keys.outputs.fc }}-${{ hashFiles('firecracker/*.patch', 'scripts/build-firecracker.sh') }}
      - name: Build Firecracker
        if: steps.fc-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-firecracker.sh
      - name: Save Firecracker
        if: steps.fc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/firecracker
          key: ${{ steps.fc-cache.outputs.cache-primary-key }}

      # Guest kernel and base root filesystem (fetch.sh skips the stock Firecracker: the patched one is there).
      - name: Restore downloads
        id: dl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/vmlinux
            artifacts/base.squashfs
          key: downloads-${{ steps.keys.outputs.downloads }}-${{ hashFiles('scripts/fetch.sh') }}
      - name: Fetch kernel and base rootfs
        run: |
          ./scripts/fetch.sh
          echo "base=$(sha256sum artifacts/base.squashfs | cut -c1-16)" >> "$GITHUB_OUTPUT"
        id: fetch
      - name: Save downloads
        if: steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/vmlinux
            artifacts/base.squashfs
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      # Root filesystem with flexvm-init: rebuilt when the guest agent, the image recipe,
      # the base image (by checksum) or the build environment change.
      - name: Restore rootfs
        id: rootfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/rootfs-*.ext4
            artifacts/rootfs.ext4
            artifacts/flexvm-init
          key: rootfs-${{ steps.keys.outputs.env }}-rust${{ env.RUST_TOOLCHAIN }}-base${{ steps.fetch.outputs.base }}-${{ hashFiles('guest/**', 'scripts/build-rootfs.sh', 'Cargo.lock', 'Cargo.toml') }}
      - name: Build rootfs
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-rootfs.sh
      - name: Save rootfs
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/rootfs-*.ext4
            artifacts/rootfs.ext4
            artifacts/flexvm-init
          key: ${{ steps.rootfs-cache.outputs.cache-primary-key }}

      - name: Build flexvm
        run: cargo build --release -p flexvm

      - name: End-to-end tests
        run: sudo python3 -u scripts/e2e.py --log-dir "$RUNNER_TEMP/e2e-logs"

      - name: Collect logs
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/e2e-logs" || true
          sudo dmesg | tail -200 > "$RUNNER_TEMP/e2e-logs/dmesg.txt" || true
      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
