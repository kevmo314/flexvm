name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: "Run the heavy shard (as the nightly does) instead of the pr splits"
        type: boolean
        default: false
  # The heavy fault scenarios (scripts/e2e.py --shard heavy), nightly.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  # The nightly run never holds up (or is held up by) a push to main.
  group: ci-${{ github.event_name == 'schedule' && 'nightly-' || '' }}${{ github.ref }}
  # Runs on main are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # flexvm's own toolchain. Firecracker builds with the one its rust-toolchain.toml pins.
  RUST_TOOLCHAIN: "1.88.0"
  # The e2e image-template case's image (pulled, then cached: see "Restore image").
  E2E_IMAGE: public.ecr.aws/docker/library/busybox:1.36
  # Where the scripts install firecracker, the kernel and the base rootfs (flexvm's default state).
  STATE: /var/lib/flexvm
  # No FC_VERSION / CI_VERSION / KERNEL overrides are set here. fetch.sh --urls resolves
  # them, and the cache keys below are built from its output, so setting one changes the keys.

jobs:
  check:
    # The release build is the e2e job's: it builds the binary that the tests run.
    name: fmt, clippy, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: "Pinned artifacts release" tells how long a release has been pending from it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --workspace
      # The #[ignore]d tests that need root (taps, routing and tc; root-owned files; the guest's bind
      # mounts), no VM: built as the runner's user, run as root.
      - name: Root unit tests
        run: |
          sudo modprobe tun
          cargo test -p flexvm -p flexvm-init --config 'target.x86_64-unknown-linux-gnu.runner="sudo -E"' -- --ignored
      # The artifacts release (what `cargo build` users download) must be built from this checkout's inputs
      # (scripts/pin-artifacts.sh --inputs): a change to them bumps ARTIFACTS_TAG in the same change, or fails
      # here, PR or main. A bumped tag is pending until it is released and pinned (RELEASING in README.md): a
      # warning, but on main (push, nightly) a failure once it has been pending for the release window.
      - name: Pinned artifacts release
        env:
          REF: ${{ github.ref }}
        run: |
          status=0
          ./scripts/pin-artifacts.sh --check || status=$?
          case $status in
            0) ;;
            3) echo "::warning::the artifacts release is pending: tag, release and pin it (RELEASING in README.md)" ;;
            4)
              if [ "$REF" != refs/heads/main ]; then
                echo "::warning::the artifacts release has been pending for longer than the release window (RELEASING in README.md)"
              else
                echo "::error::the artifacts release has been pending for longer than the release window: tag, release and pin it (RELEASING in README.md)"
                exit 1
              fi
              ;;
            *)
              echo "::error::the artifacts release is stale (built from other inputs than this checkout's) or its pins are broken: bump ARTIFACTS_TAG in scripts/versions.sh (RELEASING in README.md)"
              exit 1
              ;;
          esac
      - name: e2e scheduler self-test
        # Fake templates and workers, one of which cannot be spawned: its cases must fail.
        run: python3 scripts/e2e.py --selftest --log-dir "$RUNNER_TEMP/e2e-selftest"
      - name: lab teardown self-test
        # The lab scripts' process matching and cgroup cleanup (scripts/net-common.sh): rootless, no VM.
        run: ./scripts/net-common-test.sh

  e2e:
    # Shards (scripts/e2e.py --shard): pr (the cases, and the main and recovery scenarios) in four
    # splits side by side, balanced by e2e.py's COST; the scheduled run takes heavy (GiB-scale
    # guests, long windows) one scenario at a time.
    name: end-to-end (KVM, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.shard == 'heavy' && 150 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || inputs.heavy) && '["heavy"]' || '["pr 1/4", "pr 2/4", "pr 3/4", "pr 4/4"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -m1 -o -E 'vmx|svm' /proc/cpuinfo
          # KVM_GET_API_VERSION must answer 12, and KVM_CREATE_VM must work.
          python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); v = fcntl.ioctl(fd, 0xAE00); vm = fcntl.ioctl(fd, 0xAE01, 0); print("KVM API", v, "vm fd", vm); assert v == 12'
          nproc; free -m; uname -r

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
          cache-on-failure: true

      # flexvm builds in the background (its release profile: fat LTO, one codegen unit,
      # as shipped) while the steps below restore or build the rest; "Build flexvm" waits.
      - name: Start building flexvm
        run: |
          nohup sh -c 'cargo build --release -p flexvm; echo $? > "$RUNNER_TEMP/build.status"' > "$RUNNER_TEMP/build.log" 2>&1 &

      # The caches below restore into it as the runner's user.
      - name: State directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$STATE/artifacts" /var/lib/flexvm-test-image

      # Cache keys: the build inputs in the repo, what fetch.sh resolves (versions and
      # URLs, plus the ETags of the unversioned S3 objects), and the build environment
      # (runner image; Firecracker's toolchain is
      # pinned by its commit, FC_COMMIT in scripts/versions.sh, part of the Firecracker cache key).
      - name: Cache keys
        id: keys
        run: |
          ./scripts/fetch.sh --urls > urls.txt
          for f in vmlinux base.squashfs; do
            url=$(awk -v f="$f" '$1 == f {print $2}' urls.txt)
            # A flexvm release's assets never change (and are pinned): no ETag needed.
            case $url in https://github.com/*/releases/download/*) continue ;; esac
            etag=$(curl -sfI "$url" | tr -d '\r' | awk 'tolower($1) == "etag:" {print $2}')
            test -n "$etag"
            echo "$f-etag $etag" >> urls.txt
          done
          cat urls.txt
          echo "env=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "fc=$(grep '^firecracker ' urls.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # Until the release is pinned, fetch.sh names the stock Firecracker (a .tgz): the patched one is built here.
          if grep -q '^firecracker .*\.tgz$' urls.txt; then echo "fc-build=true" >> "$GITHUB_OUTPUT"; fi
          echo "downloads=$(sha256sum urls.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
          rm urls.txt

      # Patched Firecracker, built from this checkout's patches while its ARTIFACTS_TAG is unpinned (a change
      # to them bumps it, so a patch under review is never in the pinned release): rebuilt only when its
      # inputs change. Each artifact is saved right after it is built, so a failing test run still fills the
      # cache. Once the release is pinned, flexvm runs only its Firecracker, which fetch.sh downloads instead.
      - name: Restore Firecracker
        id: fc-cache
        if: steps.keys.outputs.fc-build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/firecracker
            ${{ env.STATE }}/artifacts/firecracker.sha256
          key: firecracker-${{ steps.keys.outputs.env }}-${{ steps.keys.outputs.fc }}-${{ hashFiles('firecracker/*.patch', 'scripts/build-firecracker.sh', 'scripts/versions.sh') }}
      - name: Build Firecracker
        if: steps.keys.outputs.fc-build == 'true' && steps.fc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools libseccomp-dev
          ./scripts/build-firecracker.sh
      - name: Save Firecracker
        if: steps.keys.outputs.fc-build == 'true' && steps.fc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/firecracker
            ${{ env.STATE }}/artifacts/firecracker.sha256
          key: ${{ steps.fc-cache.outputs.cache-primary-key }}

      # Guest kernel and the test image's base root filesystem (fetch.sh keeps the patched Firecracker built above, its
      # record checking, over the stock one; once the release is pinned, it downloads the release's).
      - name: Restore downloads
        id: dl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/vmlinux
            ${{ env.STATE }}/artifacts/base.squashfs
          key: downloads-${{ steps.keys.outputs.downloads }}-${{ hashFiles('scripts/fetch.sh', 'scripts/versions.sh', 'scripts/checksums.sha256') }}
      - name: Fetch kernel and base rootfs
        run: |
          ./scripts/fetch.sh
          echo "base=$(sha256sum "$STATE/artifacts/base.squashfs" | cut -c1-16)" >> "$GITHUB_OUTPUT"
        id: fetch
      - name: Save downloads
        if: steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STATE }}/artifacts/vmlinux
            ${{ env.STATE }}/artifacts/base.squashfs
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      # The test image (scripts/test-image.py: the base root filesystem as an OCI layout), which
      # e2e.py pulls its templates from; it makes it when the cache has none. flexvm embeds flexvm-init.
      - name: Restore test image
        id: test-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/flexvm-test-image
          key: test-image-base${{ steps.fetch.outputs.base }}-${{ hashFiles('scripts/test-image.py') }}
      - name: Own test image
        run: sudo chown -R root:root /var/lib/flexvm-test-image
      - name: squashfs-tools
        if: steps.test-image-cache.outputs.cache-hit != 'true'
        run: command -v unsquashfs > /dev/null || { sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends squashfs-tools; }

      - name: Build flexvm
        run: |
          while [ ! -e "$RUNNER_TEMP/build.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/build.log"
          exit "$(cat "$RUNNER_TEMP/build.status")"

      # The image case's pull, kept as an OCI layout (scripts/e2e.py --image-cache): restored,
      # the case builds from it without the registry (flexvm still checks every digest). Saved
      # under the image's digest; the month in the key makes a real registry pull at least
      # monthly, and on any cold cache.
      - name: Image cache key
        id: img
        run: echo "prefix=image-$(echo "$E2E_IMAGE" | tr -c 'A-Za-z0-9.\n-' _)-$(date -u +%Y%m)-" >> "$GITHUB_OUTPUT"
      - name: Restore image
        id: img-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/oci
          key: ${{ steps.img.outputs.prefix }}
          restore-keys: ${{ steps.img.outputs.prefix }}

      # A scenario that finds the runner lacks what it tests (cgroup v2, THP, IPv6, a template's room)
      # is a SKIP, which fails every shard (--no-skips).
      - name: End-to-end tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # "pr 2/4": shard pr, its second of four splits.
          set -- $SHARD
          jobs=4; if [ "$1" = heavy ]; then jobs=1; fi
          sudo python3 -u scripts/e2e.py --shard "$1" ${2:+--split "$2"} --jobs "$jobs" --no-skips --image "$E2E_IMAGE" --image-cache "$RUNNER_TEMP/image-cache" --test-image "/var/lib/flexvm-test-image" --log-dir "$RUNNER_TEMP/e2e-logs"
      - name: Test image made
        id: test-image-made
        if: always() && steps.test-image-cache.outputs.cache-hit != 'true'
        run: if [ -e "/var/lib/flexvm-test-image/index.json" ]; then echo "made=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save test image
        if: always() && steps.test-image-made.outputs.made == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/flexvm-test-image
          key: ${{ steps.test-image-cache.outputs.cache-primary-key }}

      - name: Image digest
        id: img-digest
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/image-cache" 2>/dev/null || true
          for f in "$RUNNER_TEMP"/image-cache/oci/*/index.json; do
            [ -e "$f" ] && python3 -c 'import json, sys; print("digest=" + json.load(open(sys.argv[1]))["manifests"][0]["digest"].replace(":", "-"))' "$f" >> "$GITHUB_OUTPUT"
          done
          true
      - name: Save image
        if: always() && startsWith(matrix.shard, 'pr') && steps.img-digest.outputs.digest != '' && steps.img-cache.outputs.cache-matched-key != format('{0}{1}', steps.img.outputs.prefix, steps.img-digest.outputs.digest)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/oci
          key: ${{ steps.img.outputs.prefix }}${{ steps.img-digest.outputs.digest }}

      - name: Collect logs
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/e2e-logs" || true
          sudo dmesg | tail -200 > "$RUNNER_TEMP/e2e-logs/dmesg.txt" || true
          # The background release build's output, also when "Build flexvm" never ran.
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/e2e-logs/build.log" || true
      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
