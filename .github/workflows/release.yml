name: Release artifacts

# Pushing a semver tag (vMAJOR.MINOR.PATCH) builds the patched Firecracker and re-hosts the pinned guest kernel as the
# release flexvm downloads from on first use. The tag must be ARTIFACTS_TAG in scripts/versions.sh at the
# tagged commit. Afterwards, scripts/pin-artifacts.sh pins the assets' sha256 in scripts/checksums.sha256
# (a follow-up commit) once their build provenance (attested here) verifies: from then on, flexvm builds
# download them. A release's assets never change. This file is one of a release's inputs (scripts/pin-artifacts.sh
# --inputs hashes it): changing it needs a new ARTIFACTS_TAG. The steps: "Releasing the artifacts" in README.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must use vMAJOR.MINOR.PATCH, not $TAG"
            exit 1
          fi
          want=$(env -u ARTIFACTS_TAG bash -c 'source scripts/versions.sh; echo "$ARTIFACTS_TAG"')
          if [ "$TAG" != "$want" ]; then
            echo "::error::scripts/versions.sh at this commit names $want, not $TAG"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG exists already; its assets are never replaced"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The recipe (hashed into inputs.txt, with this file: scripts/pin-artifacts.sh --inputs).
      - name: Build the assets
        run: ./scripts/release-assets.sh "$RUNNER_TEMP/state" "$RUNNER_TEMP/assets"

      - name: Upload assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error

  release:
    name: attest and publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Only this job holds signing and publishing credentials; no build scripts run here.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
          digest-mismatch: error

      - name: Check the assets
        working-directory: ${{ runner.temp }}/assets
        run: |
          ls -l
          sha256sum --check --strict SHA256SUMS
          [ "$(cut -d' ' -f3 SHA256SUMS | sort | tr '\n' ' ')" = "firecracker inputs.txt vmlinux " ]

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/firecracker
            ${{ runner.temp }}/assets/vmlinux
            ${{ runner.temp }}/assets/inputs.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$RUNNER_TEMP/assets
          {
            echo "Prebuilt patched Firecracker ($(head -1 "$out/inputs.txt" | cut -d' ' -f2)) and guest kernel for flexvm, built from ${GITHUB_SHA}."
            echo
            echo "Pin them with scripts/pin-artifacts.sh at a commit whose scripts/versions.sh names ${TAG}."
            echo
            echo '```'
            cat "$out/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$out/firecracker" "$out/vmlinux" "$out/inputs.txt" "$out/SHA256SUMS"
