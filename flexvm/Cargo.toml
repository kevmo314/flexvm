[package]
name = "flexvm"
version = "0.1.0"
edition = "2021"

[dependencies]
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Container image templates: registry pulls over HTTPS, digests, layer formats.
ureq = { version = "2", default-features = false, features = ["tls"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
ruzstd = "0.9"
tar = { version = "0.4", default-features = false }
