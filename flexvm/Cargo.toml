[package]
name = "flexvm"
license = "Apache-2.0"
version = "0.2.2"
edition = "2021"
# build.rs reads ../scripts and builds ../guest: only ever built in this workspace.
publish = false

[dependencies]
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Container image templates: registry pulls over HTTPS, digests, layer formats.
# 3.x: its chunked decoder and header parser read into a fixed buffer (2.x grows a chunk-size line without bound).
# `unversioned` (resolver, connector) is used, so minor versions are taken by hand.
ureq = { version = "~3.4.2", default-features = false, features = ["rustls"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
ruzstd = "0.9.1"
tar = { version = "0.4", default-features = false }
# The Docker Engine API (`flexvm api`): HTTP/1.1 on a Unix socket, with upgrades for attach and exec.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "macros", "time", "sync"] }
